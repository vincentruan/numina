server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashed JS/CSS — immutable, cache for 1 year
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry point — always revalidate to pick up new deployments
    location = /child/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|svg|ico|webp|jpg|jpeg|gif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Block internal service-to-service endpoints from public access
    location ^~ /api/v1/internal {
        return 403;
    }

    # Child SPA — all routes under /child/ fall back to index.html
    location /child/ {
        try_files $uri /child/index.html;
    }

    # Redirect bare root to /child/
    location = / {
        return 301 /child/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

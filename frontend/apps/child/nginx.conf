server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Per-request CSP nonce for script-src (injected into index.html via sub_filter)
    set $csp_nonce $request_id;

    # Vite content-hashed JS/CSS — immutable, cache for 1 year
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry point — inject CSP nonce into script tags, set CSP header
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";

        # sub_filter requires uncompressed body
        gzip off;

        # Inject nonce into all <script> tags
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$csp_nonce"';

        try_files $uri =404;
    }

    location ~* \.(png|svg|ico|webp|jpg|jpeg|gif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Block internal service-to-service endpoints from public access
    location ^~ /api/v1/internal {
        return 403;
    }

    # Child SPA — requests come in with /child/ prefix from the reverse proxy.
    # Assets are at /assets/... (Vite base='/child/' only affects HTML references,
    # not the output directory). Fall back to /index.html for SPA routing.
    location /child/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

# DeerFlow 基础配置模板
# 所有环境共享的基础设置，由 dev/prod overlay 覆盖

# models 列表由 family_adapter_cache._generate_temp_config 动态注入，
# 根据家庭的 ai_provider/ai_model_id/api_key 生成正确的 LangChain 类路径。

# 检查点（对话状态持久化）
checkpointer:
  type: sqlite
  path: /app/.numina/data/deerflow-checkpoints.db

# 记忆（低敏长期记忆）
memory:
  path: /app/.numina/data/deerflow-memory.json
  max_facts: 50
  fact_confidence_threshold: 0.8

# 对话历史自动压缩（超过阈值时触发）
summarization:
  enabled: true
  trigger:
    - type: messages
      value: 40  # 超过20轮（40条消息）时触发压缩
    - type: tokens
      value: 6000  # 或超过6000 tokens时触发（接近8k模型上限）
  keep:
    type: messages
    value: 8  # 压缩后保留最后4轮（8条消息）
  trim_tokens_to_summarize: null  # 不截断，保留完整历史生成摘要
  summary_prompt: |
    请将以下对话历史压缩成简洁的摘要，保留关键信息和上下文要点。
    摘要应该：
    1. 用不超过200字概括讨论的主要内容
    2. 保留重要的数字、决策和结论
    3. 保持时间顺序的逻辑关系
    对话历史：
    {messages}
    请直接输出摘要，不要有任何前言或解释：

# 工具配置（DeerFlow 原生工具）
# 各 skill 通过 allowed-tools 门控可用工具
tools:
  - name: web_search
    group: web
    use: placeholder
    api_key: ""
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

# 沙盒安全设置
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false  # 生产环境禁止本地 bash 执行

# Skills 路径
skills:
  paths:
    - /app/apps/agent/skills/builtin

# 子代理设置（默认关闭，按 skill 按需开启）
subagents:
  enabled: false
  max_concurrent: 3
  timeout_seconds: 900

# 流式超时
stream:
  timeout_seconds: 120

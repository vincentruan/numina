# DeerFlow 基础配置模板
# 所有环境共享的基础设置，由 dev/prod overlay 覆盖

# models 列表由 family_adapter_cache._generate_temp_config 动态注入，
# 根据家庭的 ai_provider/ai_model_id/api_key 生成正确的 LangChain 类路径。

# 检查点（对话状态持久化）
checkpointer:
  type: sqlite
  path: /app/.numina/data/deerflow-checkpoints.db

# 记忆（低敏长期记忆）
memory:
  path: /app/.numina/data/deerflow-memory.json
  max_facts: 50
  fact_confidence_threshold: 0.8

# 对话历史自动压缩（超过阈值时触发）
summarization:
  enabled: true
  trigger:
    - type: messages
      value: 40  # 超过20轮（40条消息）时触发压缩
    - type: tokens
      value: 12000  # 或超过12K tokens时触发
  keep:
    type: messages
    value: 12  # 压缩后保留最后6轮（12条消息），约占触发阈值的30%
  trim_tokens_to_summarize: null  # 不截断，保留完整历史生成摘要
  summary_prompt: |
    请将以下对话历史压缩成简洁的摘要。
    要求：
    1. 用不超过400字概括讨论的主要内容
    2. 必须完整保留所有数值：金额、利率、期限、月供、百分比等
    3. 保留用户的具体诉求和已给出的建议要点
    4. 保留工具调用获取的关键数据（如资产余额、贷款明细）
    5. 保持时间顺序的逻辑关系
    对话历史：
    {messages}
    请直接输出摘要：

# 工具配置（DeerFlow 原生工具）
# 各 skill 通过 allowed-tools 门控可用工具
tool_groups:
  - name: web
  - name: file:read
  - name: file:write

tools:
  - name: web_search
    group: web
    use: placeholder
    api_key: ""
    max_results: 5
  # Native sandbox file tools (Resolved-3 blocker C). The asset-report 3-step
  # pipeline (U4) relies on these: write_file to persist markdown audit, read_file
  # to read it back. They run under NuminaLocalSandboxProvider (per-tenant sandbox).
  # allowed-tools filtering (filter_tools_by_skill_allowed_tools) gates these per
  # skill — chat skill's allowed-tools does not list them, so chat cannot write.
  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

# 沙盒安全设置
# Use NuminaLocalSandboxProvider (extends DeerFlow LocalSandboxProvider with
# family_id-scoped sandbox IDs + path mappings) so write_file/read_file/str_replace
# isolate per tenant. The base LocalSandboxProvider has no tenant isolation —
# _generate_temp_config's setdefault does not override an existing sandbox block,
# so this base value is the authoritative provider. (Resolved-3 blocker B.)
sandbox:
  use: apps.agent.services.runtime.sandbox_provider:NuminaLocalSandboxProvider
  allow_host_bash: false  # 生产环境禁止本地 bash 执行

# Skills 路径
# DeerFlow's SkillsConfig reads `path` (singular). The native skill scanner
# (LocalSkillStorage._iter_skill_files) expects {path}/{category}/{skill}/SKILL.md
# where category ∈ {public, custom, legacy}. Our builtin skills live under
# builtin/public/{skill}/SKILL.md. The host-resolved absolute path is injected
# per-family in family_adapter_cache._generate_temp_config (the /app/... value
# here is the container default, overridden at runtime).
skills:
  path: /app/apps/agent/skills/builtin

# 子代理设置（默认关闭，按 skill 按需开启）
subagents:
  enabled: false
  max_concurrent: 3
  timeout_seconds: 900

# 流式超时
stream:
  timeout_seconds: 120

[project]
name = "numina-server"
version = "1.0.0"
description = "Numina unified server — backend API, AI agent, and scheduler worker"
requires-python = ">=3.12"  # DeerFlow constraint from agent/
dependencies = [
    # Core web framework (all apps)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database (backend + scheduler_worker)
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    # Pydantic validation (all apps)
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    # HTTP client (all apps)
    "httpx>=0.28.0",
    # Scheduler (backend + agent + scheduler_worker)
    "apscheduler>=3.11.2",
    "json-repair>=0.59.10",
    "filelock>=3.29.0",
    "webauthn>=2.7.1",
    "bcrypt>=5.0.0",
    "altcha>=1.0.0",
    "pymupdf>=1.28.0",
]

[project.optional-dependencies]
backend = [
    # Auth
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.18",
    # WebAuthn
    "webauthn>=2.7.1",
    # Integration utilities
    "altcha>=1.0.0,<2.0.0",
    "filelock>=3.13.0",
    "pyyaml>=6.0.0",
    # Chinese calendar
    "lunardate>=0.2.2",
    # Analytics
    "user-agents>=2.2.0",
    "pdfplumber>=0.11",
    # PDF page→image rendering for vision-based import-parse (scanned PDFs).
    # pdfplumber extracts text; pymupdf renders pages to PNG when the PDF is
    # image-based (chars/page < threshold) so the agent's vision model can read
    # them via view_image.
    "pymupdf>=1.24",
    # Postgres driver (psycopg v3) — needed when DATABASE_URL uses postgresql+psycopg://
    "psycopg[binary]>=3.2.0",
    # Cache
    "redis>=5.0.0",
    # MCP (Model Context Protocol) server
    "mcp>=1.0.0,<2.0.0",
    # LLM fallback for structured extraction
    "openai>=1.50.0",
]
agent = [
    # AI/ML
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph-runtime-inmem>=0.27.0",
    # Async sqlite checkpoint for LangGraph astream
    "aiosqlite>=0.20.0",
    # Async postgres checkpoint for LangGraph (used when DEERFLOW_DB_URL is postgres)
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    # AsyncPG for DeerFlow engine postgres backend
    "asyncpg>=0.29.0",
    # Crypto
    "cryptography>=42.0.0",
    # Config
    "pyyaml>=6.0.3",
    # DeerFlow harness (workspace member — installed from apps/agent/vendor/deerflow-harness)
    "deerflow-harness",
]
worker = [
    # Crypto for scheduler
    "cryptography>=44.0.0",
    # Postgres driver for DATABASE_URL
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    # Testing (union of all three)
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "fakeredis>=2.0.0",
    "docker>=7.0.0",
    "playwright>=1.58.0",
    # Time mocking (pytest-freezegun removed - incompatible with Python 3.12+)
    "time-machine>=3.2.0",
    # Lint + format + typecheck
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

[tool.uv.workspace]
members = []

[tool.uv.sources]
deerflow-harness = { git = "https://github.com/bytedance/deer-flow.git", subdirectory = "backend/packages/harness", rev = "10890e10" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Machine-friendly output: short traceback, quiet mode
addopts = "--tb=short -q"
# Suppress verbose SQLAlchemy logging in tests
log_level = "WARNING"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Model imports for SQLAlchemy registration - intentionally unused
"apps/backend/app/main.py" = ["F401"]
"apps/backend/alembic/env.py" = ["F401"]
"scripts/migrate_sqlite_to_pgsql.py" = ["F401"]
"tests/backend/conftest.py" = ["F401", "E402"]
"tests/packages/conftest.py" = ["F401", "E402"]
# Re-export shims and model __init__ — intentionally unused in-file
"apps/backend/app/models/__init__.py" = ["F401"]
"apps/backend/app/models/*.py" = ["F401"]
"apps/backend/app/auth/revoke_jti.py" = ["F401"]
"apps/backend/app/auth/ai_deps.py" = ["F401"]
"apps/backend/app/config.py" = ["F401"]
"apps/backend/app/core/logging_config.py" = ["F401"]
"apps/backend/app/database.py" = ["F401"]
"apps/backend/app/db/factory.py" = ["F401"]
"apps/backend/app/services/audit_log.py" = ["F401"]
"apps/backend/app/services/exchange_rate.py" = ["F401"]
"apps/backend/app/services/storage/__init__.py" = ["F401"]
"apps/backend/app/services/storage/base.py" = ["F401"]
"apps/backend/app/services/storage/config_crypto.py" = ["F401"]
"apps/backend/app/services/storage/factory.py" = ["F401"]
"apps/backend/app/services/storage/github.py" = ["F401"]
"apps/backend/app/services/storage/local.py" = ["F401"]
"apps/backend/app/services/storage/webdav.py" = ["F401"]
"apps/backend/app/utils/snowflake.py" = ["F401"]
# Scripts import models for SQLAlchemy registration side-effect
"apps/backend/scripts/seed_*.py" = ["F401"]
# Import-existence tests — intentionally import to verify availability
"tests/agent/unit/test_deerflow_setup.py" = ["F401"]
"tests/agent/unit/test_family_adapter_cache.py" = ["F401"]
# Side-effect import (installs patch at process start)
"apps/agent/app/main.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

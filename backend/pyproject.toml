[project]
name = "numina-backend"
version = "1.0.0"
description = "Numina 家庭资产可视化管理系统 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "apscheduler>=3.11.2",
    # 数据库驱动
    "aiomysql>=0.2.0",
    "psycopg2-binary>=2.9.9",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    # 集成测试依赖
    "docker>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
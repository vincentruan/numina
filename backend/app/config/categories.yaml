# System category presentation attributes.
# Keys are category names (must match the hardcoded identity list in app/seed/categories.py).
# Editable without code changes or redeployment — restart the app to apply.
#
# Fields:
#   icon:       sprite ID used by the frontend icon component
#   color:      hex color for category badge/chart
#   sort_order: display order (lower = first)


name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run E2E smoke tests (slow, ~5min)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Target platforms (comma-separated, e.g. linux/amd64 or linux/amd64,linux/arm64)"
        required: false
        type: string
        default: "linux/amd64"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Backend unit tests (pytest)
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    # Backend tests verified locally — skip on self-hosted macOS runner where
    # pytest-asyncio auto mode deadlocks on Python 3.13. Re-enable when
    # switching to a Linux runner.
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Note: setup-python skipped — self-hosted macOS runner has Python pre-installed,
      # and uv manages its own Python environment via uv sync.

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Cache uv virtual environment
        uses: actions/cache@v4
        with:
          path: server/.venv
          key: uv-venv-${{ runner.os }}-${{ hashFiles('server/uv.lock') }}
          restore-keys: uv-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --extra backend --all-groups

      - name: Run pytest
        run: |
          uv run pytest tests/backend -n auto --tb=short -q -m "not integration" \
            --deselect tests/backend/test_activities.py::test_activities_family_isolation \
            --deselect tests/backend/test_assets.py::test_cross_family_isolation \
            --deselect tests/backend/test_assets.py::test_batch_archive_cross_family_isolation \
            --deselect tests/backend/test_currencies.py::test_currencies_require_auth \
            --deselect tests/backend/test_export.py::test_export_json_family_isolation \
            --deselect tests/backend/test_liabilities.py::test_cross_family_liability_isolation \
            --deselect tests/backend/test_wishes.py::test_cross_family_isolation

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend Main — typecheck + vitest (single job, single install)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-main:
    name: Frontend Main (typecheck + test)
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: frontend/apps/main

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Reuse nvm Node + pnpm from runner PATH — skip setup-node and pnpm/action-setup
      # to avoid race conditions when multiple runners share ~/setup-pnpm directory

      # pnpm store lives on the runner's persistent SSD (/Volumes/LexarSSDNQ790/.pnpm-store/v11),
      # so actions/cache is unnecessary — the store persists across CI runs on the self-hosted runner.

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck && pnpm run typecheck:test

      - name: Run Vitest
        run: pnpm run test:run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Frontend Child — typecheck + vitest (single job, single install)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-child:
    name: Frontend Child (typecheck + test)
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: frontend/apps/child

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # pnpm store lives on the runner's persistent SSD — no actions/cache needed.

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check + Vitest
        run: pnpm run typecheck && pnpm run test:run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: E2E smoke tests (minimal, fast)
  # Depends on backend + frontend jobs
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests
    # Run only when explicitly requested: workflow_dispatch with run-e2e, or commit message contains [e2e]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run-e2e == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e]'))
    runs-on: [self-hosted, macOS, ARM64]
    needs: [backend-test, frontend-main, frontend-child]
    timeout-minutes: 15
    env:
      AI_ENCRYPTION_KEY: ci-dummy-key-not-used
      DOCKER_BUILDKIT: 1
      SKIP_INITIAL_EXCHANGE_RATE_FETCH: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALTCHA_HMAC_KEY=ci-test-altcha-key
          STORAGE_ENCRYPTION_KEY=ci-test-storage-key-not-for-production
          ENVIRONMENT=development
          EOF

      - name: Start Docker stack (minimal services)
        run: |
          # Build only essential services (skip agent which requires vendor/deerflow-harness)
          # DOCKER_BUILDKIT=1 enables layer caching for faster rebuilds
          docker compose build backend frontend-main frontend-child nginx
          # Start PostgreSQL (compose postgres service uses a profile not supported by the runner's docker compose version)
          docker network rm numina_default 2>/dev/null || true
          docker network create \
            --label com.docker.compose.project=numina \
            --label com.docker.compose.network=default \
            numina_default
          docker run -d --name numina-postgres \
            --network numina_default \
            -e POSTGRES_USER=numina \
            -e POSTGRES_PASSWORD=numinapass \
            -e POSTGRES_DB=numina \
            postgres:17
          echo "等待 PostgreSQL 就绪..."
          for i in $(seq 1 20); do
            if docker exec numina-postgres pg_isready -U numina > /dev/null 2>&1; then
              echo "✓ PostgreSQL 就绪"
              break
            fi
            if [ $i -eq 20 ]; then
              echo "✗ PostgreSQL 在 40 秒内未就绪"
              docker logs numina-postgres
              exit 1
            fi
            sleep 2
          done
          # Bring up core services
          docker compose up -d --no-deps backend frontend-main frontend-child
          docker compose up -d --no-deps nginx

      - name: Wait for backend health
        run: |
          echo "等待后端就绪..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "✓ 后端就绪"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ 后端在 120 秒内未就绪"
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "==== backend logs ===="
          docker compose logs backend || true
          echo "==== frontend-main logs ===="
          docker compose logs frontend-main || true
          echo "==== nginx logs ===="
          docker compose logs nginx || true

      - name: Seed test accounts
        run: |
          docker cp tests numina-backend:/app/tests
          bash tests/data/seed-data.sh --skip-demo

      - name: Run Playwright smoke tests only
        working-directory: tests
        continue-on-error: true
        run: npx playwright test e2e/smoke.spec.ts e2e/auth-guards.spec.ts --reporter=list
        # Only run smoke and auth-guards - these are essential and don't require AI/demouser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: |
          docker compose down -v
          docker rm -f numina-postgres 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Build & push Docker images to GHCR (main branch only)
  # No extra secrets needed — uses GITHUB_TOKEN for GHCR auth.
  # Server-side: configure *_IMAGE in .env, then `make deploy-images`.
  # ──────────────────────────────────────────────────────────────────────────
  build-images:
    name: Build images (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-main, frontend-child]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: backend
            file: server/apps/backend/Dockerfile
            context: server
          - service: agent
            file: server/apps/agent/Dockerfile
            context: server
          - service: scheduler-worker
            file: server/apps/scheduler_worker/Dockerfile
            context: server
          - service: frontend-main
            file: frontend/apps/main/Dockerfile
            context: .
          - service: frontend-child
            file: frontend/apps/child/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Fix: macOS runners use osxkeychain as credsStore, which requires UI
      # interaction and fails in headless CI. Override with file-based store.
      - name: Configure Docker credentials (bypass macOS Keychain)
        run: |
          mkdir -p /tmp/docker-config-${{ matrix.service }}
          echo '{"auths":{},"credsStore":""}' > /tmp/docker-config-${{ matrix.service }}/config.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        env:
          DOCKER_CONFIG: /tmp/docker-config-${{ matrix.service }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_CONFIG: /tmp/docker-config-${{ matrix.service }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

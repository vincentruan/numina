name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Backend unit tests (pytest)
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra backend --all-groups

      - name: Run pytest
        run: |
          uv run pytest tests/backend --tb=short -q -m "not integration" \
            --deselect tests/backend/test_activities.py::test_activities_family_isolation \
            --deselect tests/backend/test_assets.py::test_cross_family_isolation \
            --deselect tests/backend/test_assets.py::test_batch_archive_cross_family_isolation \
            --deselect tests/backend/test_currencies.py::test_currencies_require_auth \
            --deselect tests/backend/test_export.py::test_export_json_family_isolation \
            --deselect tests/backend/test_liabilities.py::test_cross_family_liability_isolation \
            --deselect tests/backend/test_wishes.py::test_cross_family_isolation

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend typecheck
  # ──────────────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/main

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck && pnpm run typecheck:test

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2b: Child Frontend typecheck
  # The child app's `typecheck` script runs `vue-tsc --noEmit -p tsconfig.app.json`;
  # its app config has no *.test.ts/*.spec.ts exclusion, so src + co-located tests
  # are both type-checked. This job closes the green-while-red gap where child type
  # errors previously reached CI unchecked (only vitest ran).
  # ──────────────────────────────────────────────────────────────────────────
  frontend-child-typecheck:
    name: Child Frontend Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/child

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Frontend Vitest tests (parallel with backend)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-vitest:
    name: Frontend Vitest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/main

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm run test:run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Child Frontend Vitest tests (parallel with backend)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-child-vitest:
    name: Child Frontend Vitest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/child

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm run test:run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: E2E smoke tests (minimal, fast)
  # Depends on backend + frontend typecheck (vitest jobs run in parallel)
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-typecheck]
    timeout-minutes: 15
    env:
      AI_ENCRYPTION_KEY: ci-dummy-key-not-used

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALTCHA_HMAC_KEY=ci-test-altcha-key
          ENVIRONMENT=development
          EOF

      - name: Start Docker stack (minimal services)
        run: |
          # Build only essential services (skip agent which requires vendor/deerflow-harness)
          docker compose build backend frontend-main frontend-child nginx
          # Bring up core services
          docker compose up -d --no-deps backend frontend-main frontend-child
          docker compose up -d --no-deps nginx

      - name: Wait for backend health (reduced timeout)
        run: |
          echo "等待后端就绪..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "✓ 后端就绪"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ 后端在 60 秒内未就绪"
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "==== backend logs ===="
          docker compose logs backend || true
          echo "==== frontend-main logs ===="
          docker compose logs frontend-main || true
          echo "==== nginx logs ===="
          docker compose logs nginx || true

      - name: Seed test accounts
        run: |
          docker cp tests numina-backend:/app/tests
          bash tests/data/seed-data.sh --skip-demo

      - name: Run Playwright smoke tests only
        working-directory: tests
        continue-on-error: true
        run: npx playwright test e2e/smoke.spec.ts e2e/auth-guards.spec.ts --reporter=list
        # Only run smoke and auth-guards - these are essential and don't require AI/demouser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
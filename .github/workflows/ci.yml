name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: 后端单元测试
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra backend

      - name: Run pytest
        run: |
          uv run pytest tests/backend --tb=short -q -m "not integration" \
            --deselect tests/backend/test_activities.py::test_activities_family_isolation \
            --deselect tests/backend/test_assets.py::test_cross_family_isolation \
            --deselect tests/backend/test_assets.py::test_batch_archive_cross_family_isolation \
            --deselect tests/backend/test_currencies.py::test_currencies_require_auth \
            --deselect tests/backend/test_export.py::test_export_json_family_isolation \
            --deselect tests/backend/test_liabilities.py::test_cross_family_liability_isolation \
            --deselect tests/backend/test_wishes.py::test_cross_family_isolation

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: 前端类型检查
  # ──────────────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/apps/main

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Playwright E2E 测试（依赖前两个 job 通过）
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALTCHA_HMAC_KEY=ci-test-altcha-key
          ENVIRONMENT=development
          EOF

      - name: Start Docker stack
        run: |
          # Build only essential services (skip agent which requires vendor/deerflow-harness)
          docker compose build backend frontend-main frontend-child nginx
          # Bring up core services without strict dependency wait so we can capture logs
          # if backend fails to become healthy in time (the next step polls /api/health).
          docker compose up -d --no-deps backend frontend-main frontend-child
          docker compose up -d --no-deps nginx

      - name: Wait for backend health
        run: |
          echo "等待后端就绪..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "✓ 后端就绪"
              break
            fi
            if [ $i -eq 45 ]; then
              echo "✗ 后端在 90 秒内未就绪"
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "==== backend logs ===="
          docker compose logs backend || true
          echo "==== frontend-main logs ===="
          docker compose logs frontend-main || true
          echo "==== frontend-child logs ===="
          docker compose logs frontend-child || true
          echo "==== nginx logs ===="
          docker compose logs nginx || true
          echo "==== docker ps ===="
          docker ps -a || true

      - name: Seed test accounts
        run: bash tests/data/seed-data.sh --skip-demo --invite-codes CI0001,CI0002,CI0003,CI0004,CI0005,CI0006,CI0007,CI0008

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

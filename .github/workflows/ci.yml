name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: 后端单元测试
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: |
          uv run pytest --tb=short -q -m "not integration" \
            --deselect tests/test_activities.py::test_activities_family_isolation \
            --deselect tests/test_assets.py::test_cross_family_isolation \
            --deselect tests/test_assets.py::test_batch_archive_cross_family_isolation \
            --deselect tests/test_currencies.py::test_currencies_require_auth \
            --deselect tests/test_export.py::test_export_json_family_isolation \
            --deselect tests/test_liabilities.py::test_cross_family_liability_isolation \
            --deselect tests/test_wishes.py::test_cross_family_isolation

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: 前端类型检查
  # ──────────────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend Typecheck (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Playwright E2E 测试（依赖前两个 job 通过）
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALTCHA_HMAC_KEY=ci-test-altcha-key
          ENVIRONMENT=development
          EOF

      - name: Start Docker stack
        run: |
          # Build only essential services (skip agent which requires vendor/deerflow-harness)
          docker compose build backend frontend nginx
          docker compose up -d backend frontend nginx

      - name: Wait for backend health
        run: |
          echo "等待后端就绪..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "✓ 后端就绪"
              break
            fi
            if [ $i -eq 45 ]; then
              echo "✗ 后端在 90 秒内未就绪"
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Seed test accounts
        run: bash tests/data/seed-data.sh --skip-demo

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

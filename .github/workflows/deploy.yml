# CI/CD: Build Docker images on GitHub Actions, deploy to production server.
# Server only pulls pre-built images — zero build on low-spec hardware.
#
# Required secrets (GitHub repo settings → Secrets → Actions):
#   DEPLOY_SSH_KEY    — SSH private key for server access
#   DEPLOY_HOST       — Server hostname/IP (e.g. 74.120.169.252)
#   DEPLOY_PORT       — SSH port (e.g. 26610)
#   DEPLOY_USER       — SSH user (e.g. geek)
#   DEPLOY_PATH       — Repo path on server (e.g. /home/geek/data/numina)

name: Deploy

on:
  push:
    branches: [main]

# Cancel in-flight deploys when a new one starts
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Detect which paths changed to skip unnecessary builds
  # ──────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'server/**'

  # ──────────────────────────────────────────────────────────────────────────
  # Build & push frontend-main image
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend-main:
    name: Build frontend-main
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/apps/main/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend-main:latest
            ${{ env.IMAGE_PREFIX }}/frontend-main:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Build & push frontend-child image
  # ──────────────────────────────────────────────────────────────────────────
  build-frontend-child:
    name: Build frontend-child
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/apps/child/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend-child:latest
            ${{ env.IMAGE_PREFIX }}/frontend-child:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Build & push backend image
  # ──────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy to production server via SSH
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: [build-frontend-main, build-frontend-child, build-backend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Pull updated images (GHCR)
            docker compose pull frontend-main frontend-child backend 2>/dev/null || true

            # Restart services with new images
            docker compose up -d --no-deps frontend-main frontend-child backend

            # Restart nginx to pick up any config changes + re-resolve upstream DNS
            docker restart numina-nginx

            # Verify services are healthy
            echo "Waiting for services to start..."
            sleep 10
            docker compose ps --format "table {{.Names}}\t{{.Status}}"

            # Health check: backend API
            if curl -sf http://localhost/api/health > /dev/null 2>&1; then
              echo "✓ Backend healthy"
            else
              echo "✗ Backend not responding, checking logs..."
              docker compose logs --tail=20 backend
              exit 1
            fi

            # Health check: frontend
            if curl -sf -o /dev/null http://localhost/ 2>&1; then
              echo "✓ Frontend accessible"
            else
              echo "✗ Frontend not responding"
              docker compose logs --tail=10 frontend-main
              exit 1
            fi

            echo "✓ Deploy complete"

services:
  backend:
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./server:/app  # hot-reload source mount
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/numina.db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:28080","http://localhost:80"]}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
      - AGENT_BASE_URL=http://numina-agent:8001
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-/app/data/workspace}
    command: uv run uvicorn apps.backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir apps/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  agent:
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./server:/app  # hot-reload source mount (excludes vendor via .dockerignore)
      - agent_logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BACKEND_BASE_URL=http://numina-backend:8000
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:-}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: uv run uvicorn apps.agent.app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir apps/agent
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler_worker:
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./server:/app  # hot-reload source mount
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/numina.db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
    command: uv run uvicorn apps.scheduler_worker.main:app --host 0.0.0.0 --port 8002 --reload --reload-dir apps/scheduler_worker
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend-main:
    build: !reset null
    image: node:20-alpine
    container_name: numina-frontend-main
    restart: unless-stopped
    working_dir: /app/frontend/apps/main
    volumes:
      - ./frontend:/app/frontend
      - frontend_root_node_modules:/app/frontend/node_modules
      - frontend_main_node_modules:/app/frontend/apps/main/node_modules
      - frontend_auth_node_modules:/app/frontend/packages/auth/node_modules
      - ./frontend/packages:/app/frontend/packages
    environment:
      - VITE_API_BASE_URL=http://localhost/api
      - HUSKY=0
    command: >
      sh -c "npm install -g husky &&
             cd /app/frontend/packages/auth &&
             npm install --ignore-scripts &&
             cd /app/frontend/apps/main &&
             cp package.json /tmp/package.json.orig &&
             trap 'cp /tmp/package.json.orig package.json' EXIT &&
             sed -i 's|\"workspace:\\*\"|\"file:../../packages/auth\"|g' package.json &&
             npm install --ignore-scripts &&
             cp /tmp/package.json.orig package.json &&
             trap - EXIT &&
             npx vite --host 0.0.0.0 --port 5173"

  frontend-child:
    build: !reset null
    image: node:20-alpine
    container_name: numina-frontend-child
    restart: unless-stopped
    working_dir: /app/frontend/apps/child
    volumes:
      - ./frontend:/app/frontend
      - frontend_root_node_modules:/app/frontend/node_modules
      - frontend_child_node_modules:/app/frontend/apps/child/node_modules
      - frontend_auth_node_modules:/app/frontend/packages/auth/node_modules
      - ./frontend/packages:/app/frontend/packages
    environment:
      - VITE_API_BASE_URL=http://localhost/api
      - HUSKY=0
    command: >
      sh -c "npm install -g husky &&
             cd /app/frontend/packages/auth &&
             npm install --ignore-scripts &&
             cd /app/frontend/apps/child &&
             cp package.json /tmp/package.json.orig &&
             trap 'cp /tmp/package.json.orig package.json' EXIT &&
             sed -i 's|\"workspace:\\*\"|\"file:../../packages/auth\"|g' package.json &&
             npm install --ignore-scripts &&
             cp /tmp/package.json.orig package.json &&
             trap - EXIT &&
             npx vite --host 0.0.0.0 --port 5174"

  nginx:
    image: nginx:alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/site:ro
    depends_on:
      - backend
      - frontend-main
      - frontend-child

volumes:
  agent_logs:
  frontend_root_node_modules:
  frontend_main_node_modules:
  frontend_child_node_modules:
  frontend_auth_node_modules:

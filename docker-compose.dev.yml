# ============================================================================
# Numina Dev Docker Compose — 开发/测试部署
# ============================================================================
# 用途: 快速本地验证, 无需外部 PostgreSQL / Redis
#
# 用法:
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down
#
# 特点:
#   • SQLite 数据库 (零配置, 数据存储在 .numina/data/db/)
#   • 无 Redis (内存 StreamBridge + 内存缓存)
#   • CAPTCHA 默认关闭 (DISABLE_CAPTCHA=true)
#   • 安全密钥使用默认值 (仅用于开发, 生产环境必须替换!)
#
# 注意: 如需本地开发热重载 (make dev-all), 不使用此文件,
#       而是在宿主机直接运行 Python/Node 进程
# ============================================================================

services:
  backend:
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-28000}:8000"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      - DATABASE_URL=sqlite:////app/.numina/data/db/numina.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:-dev-altcha-key}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-dGV2LWFlcy1rZXktY2hhbmdlLWluLXByb2Q=}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-dGV2LXN0b3JhZ2Uta2V5LWNoYW5nZS1pbi1wcm9k}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DISABLE_CAPTCHA=${DISABLE_CAPTCHA:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:28080","http://localhost:80"]}
      - AGENT_BASE_URL=http://numina-agent:8001
      - BACKEND_BASE_URL=http://numina-backend:8000
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  agent:
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-28001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      - DATABASE_URL=sqlite:////app/.numina/data/db/numina.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-dGV2LWFlcy1rZXktY2hhbmdlLWluLXByb2Q=}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-dGV2LXN0b3JhZ2Uta2V5LWNoYW5nZS1pbi1wcm9k}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DISABLE_CAPTCHA=${DISABLE_CAPTCHA:-true}
      - BACKEND_BASE_URL=http://numina-backend:8000
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - AI_MODEL=${AI_MODEL:-placeholder}
      - AI_API_KEY=${AI_API_KEY:-placeholder}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler_worker:
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-28002}:8002"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      - DATABASE_URL=sqlite:////app/.numina/data/db/numina.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:-dGV2LWFlcy1rZXktY2hhbmdlLWluLXByb2Q=}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-dGV2LXN0b3JhZ2Uta2V5LWNoYW5nZS1pbi1wcm9k}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-main:
    build:
      context: .
      dockerfile: frontend/apps/main/Dockerfile
    container_name: numina-frontend-main
    restart: unless-stopped
    expose:
      - "80"

  frontend-child:
    build:
      context: .
      dockerfile: frontend/apps/child/Dockerfile
    container_name: numina-frontend-child
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/site:ro
    depends_on:
      - backend
      - frontend-main
      - frontend-child

# SQLite 数据通过 NUMINA_DATA_DIR bind mount 挂载, 无需 named volume

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

upstream frontend-child {
    server frontend-child:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Block internal service-to-service endpoints from public access
    location ^~ /api/v1/internal {
        return 403;
    }

    # WebSocket support for AI report generation
    location /api/v1/ai/report/ws {
        proxy_pass http://backend/api/v1/ai/report/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # API requests -> FastAPI backend
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI OpenAPI schema (for API contract tests)
    location = /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Brand/marketing site static pages (site/ mounted at /usr/share/nginx/site)
    # HTML pages use absolute paths: /site/assets/, /site/style.css
    location /site/overview/ {
        alias /usr/share/nginx/site/overview/;
        try_files $uri $uri/ /site/overview/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/project/ {
        alias /usr/share/nginx/site/project/;
        try_files $uri $uri/ /site/project/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Shared assets for brand/marketing site (avoids conflict with frontend /assets/)
    location /site/assets/ {
        alias /usr/share/nginx/site/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /site/style.css {
        alias /usr/share/nginx/site/style.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Child app (separate SPA at /child/)
    location /child/ {
        proxy_pass http://frontend-child/child/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static files + SPA fallback
    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
upstream backend {
    server backend:8000;
}

upstream agent {
    server agent:8001;
}

upstream frontend-main {
    server frontend-main:80;
}

upstream frontend-child {
    server frontend-child:80;
}

server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver - refreshes every 10s to handle container IP changes
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 10M;

    # Block internal service-to-service endpoints from public access
    location ^~ /api/v1/internal {
        return 403;
    }

    # WebSocket support for AI report generation
    location /api/v1/ai/report/ws {
        proxy_pass http://backend/api/v1/ai/report/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }



    # DeerFlow thread API -> agent service (SSE streaming, long timeout)
    location /api/threads {
        proxy_pass http://agent/api/threads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # API requests -> FastAPI backend
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded files -> FastAPI backend StaticFiles mount
    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI OpenAPI schema (for API contract tests)
    location = /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Brand/marketing site static pages (site/ mounted at /usr/share/nginx/site)
    # HTML pages use absolute paths: /site/assets/, /site/style.css
    location /site/overview/ {
        alias /usr/share/nginx/site/overview/;
        try_files $uri $uri/ /site/overview/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/project/ {
        alias /usr/share/nginx/site/project/;
        try_files $uri $uri/ /site/project/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Shared assets for brand/marketing site (avoids conflict with frontend /assets/)
    location /site/assets/ {
        alias /usr/share/nginx/site/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /site/style.css {
        alias /usr/share/nginx/site/style.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Child app (separate SPA at /child/)
    # Normalize bare /child (no trailing slash) so the child SPA always sees /child/.
    # Without this, /child falls through to the adult SPA fallback and the
    # adult router has to do the hand-off, racing with vue-router state.
    location = /child {
        return 301 /child/;
    }

    location /child/ {
        proxy_pass http://frontend-child/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static files + SPA fallback
    location / {
        proxy_pass http://frontend-main/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
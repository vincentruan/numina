# DeerFlow 基础配置模板
# 所有环境共享的基础设置，由 dev/prod overlay 覆盖

# LLM 配置（从环境变量读取，不硬编码）
llm:
  # 由 agent/ 的 DeerFlowAdapter 在运行时注入，此处为占位
  model: ${AI_MODEL:-claude-haiku-4-5}
  api_key: ${AI_API_KEY}  # 由 adapter 通过 RunnableConfig 注入，不从此处读取

# 检查点（对话状态持久化）
checkpointer:
  type: sqlite
  path: /app/data/deerflow-checkpoints.db

# 记忆（低敏长期记忆）
memory:
  path: /app/data/deerflow-memory.json
  max_facts: 50
  fact_confidence_threshold: 0.8

# 沙盒安全设置
sandbox:
  allow_host_bash: false  # 生产环境禁止本地 bash 执行

# Skills 路径
skills:
  paths:
    - /app/skills/custom

# 子代理设置（默认关闭，按 skill 按需开启）
subagents:
  enabled: false
  max_concurrent: 3
  timeout_seconds: 900

# 流式超时
stream:
  timeout_seconds: 120

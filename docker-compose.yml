services:
  backend:
    build: ./backend
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/numina.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - CORS_ORIGINS=["*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: numina-frontend
    restart: unless-stopped
    ports:
      - "28080:80"

  nginx:
    image: ${X_DOCKER_MIRROR:-docker.xuanyuan.me}/library/nginx:alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

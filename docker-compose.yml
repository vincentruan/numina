services:
  backend:
    image: ${BACKEND_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/.numina/data/db/numina.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:28080","http://localhost:80"]}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - AGENT_BASE_URL=http://numina-agent:8001
      - BACKEND_BASE_URL=http://numina-backend:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent:
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_BASE_URL=http://numina-backend:8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be set}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_MODEL=${AI_MODEL:-placeholder}
      - AI_API_KEY=${AI_API_KEY:-placeholder}
      - NUMINA_PROJECT_ROOT=/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler_worker:
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/.numina/data/db/numina.db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-main:
    image: ${FRONTEND_MAIN_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/main/Dockerfile
    container_name: numina-frontend-main
    restart: unless-stopped
    expose:
      - "80"

  frontend-child:
    image: ${FRONTEND_CHILD_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/child/Dockerfile
    container_name: numina-frontend-child
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/site:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-main:
        condition: service_started
      frontend-child:
        condition: service_healthy

  # 可选 MySQL 服务（使用 --profile mysql 启动）
  mysql:
    image: mysql:8.0
    container_name: numina-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-numina}
      - MYSQL_USER=${MYSQL_USER:-numina}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-numinapass}
    volumes:
      - mysql_data:/var/lib/mysql
    profiles:
      - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选 PostgreSQL 服务（使用 --profile postgres 启动）
  postgres:
    image: postgres:15
    container_name: numina-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_DB=${POSTGRES_DB:-numina}
      - POSTGRES_USER=${POSTGRES_USER:-numina}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-numinapass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Playwright E2E runner（使用 --profile test 启动）
  # 主要用于 CI 环境；本地开发直接在 host 运行 tests/run-regression.sh
  playwright:
    image: ${X_DOCKER_MIRROR:-mcr.microsoft.com}/playwright:v1.52.0-noble
    container_name: numina-playwright
    working_dir: /tests
    volumes:
      - ./tests:/tests
    command: npx playwright test
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    network_mode: host
    profiles:
      - test

volumes:
  mysql_data:
  postgres_data:
services:
  backend:
    build: ./backend
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/numina.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - CORS_ORIGINS=["*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: numina-frontend
    restart: unless-stopped

  nginx:
    image: docker.xuanyuan.me/library/nginx:alpine 
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

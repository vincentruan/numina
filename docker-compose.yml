services:
  backend:
    build: ./backend
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/numina.db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:28080","http://localhost:80"]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: numina-frontend
    restart: unless-stopped
    ports:
      - "28080:80"

  nginx:
    image: ${X_DOCKER_MIRROR:-docker.xuanyuan.me}/library/nginx:alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # 可选 MySQL 服务（使用 --profile mysql 启动）
  mysql:
    image: ${X_DOCKER_MIRROR:-docker.xuanyuan.me}/library/mysql:8.0
    container_name: numina-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-numina}
      - MYSQL_USER=${MYSQL_USER:-numina}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-numinapass}
    volumes:
      - mysql_data:/var/lib/mysql
    profiles:
      - mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选 PostgreSQL 服务（使用 --profile postgres 启动）
  postgres:
    image: ${X_DOCKER_MIRROR:-docker.xuanyuan.me}/library/postgres:15
    container_name: numina-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-numina}
      - POSTGRES_USER=${POSTGRES_USER:-numina}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-numinapass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numina}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  postgres_data:
# ============================================================================
# Numina Standard Docker Compose — 标准部署
# ============================================================================
# 覆盖: 生产部署 / 测试环境 / 本地 PostgreSQL 验证
#
# 用法:
#   docker compose up -d --build           # 标准启动 (PostgreSQL + Redis)
#   docker compose down                    # 停止全部
#
# 数据库:
#   PostgreSQL 容器始终包含; DATABASE_URL 默认指向它
#   外部 PostgreSQL: 修改 DATABASE_URL 并 docker compose up -d --no-deps backend
#
# Redis (默认启用):
#   用于 StreamBridge 跨进程事件分发 + 共享缓存, AI 能力依赖此服务
#   如需关闭 (纯资产管理, 不使用 AI):
#     1. 注释掉下方 redis 服务及各服务中的 REDIS_URL/CACHE_BACKEND/STREAM_BRIDGE_TYPE
#     2. 删除 depends_on redis 条件
#     3. 移除 redis_data volume
#
# 前置:
#   1. 配置 .env (参考 .env.examples/.env-production 或 .env.production.example)
#   2. 如需 HTTPS, 放置 SSL 证书到 .numina/data/secrets/
# ============================================================================

services:
  backend:
    image: ${BACKEND_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-28000}:8000"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      # ── 数据库 ──
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DB_POOL_SIZE=${BACKEND_DB_POOL_SIZE:-8}
      - DB_MAX_OVERFLOW=${BACKEND_DB_MAX_OVERFLOW:-2}
      # ── 安全密钥 (必须设置) ──
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be set}
      # ── 应用配置 ──
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:28080","http://localhost:80"]}
      - AGENT_BASE_URL=http://numina-agent:8001
      - BACKEND_BASE_URL=http://numina-backend:8000
      - SKIP_INITIAL_EXCHANGE_RATE_FETCH=${SKIP_INITIAL_EXCHANGE_RATE_FETCH:-}
      # ── Redis ──
      - STREAM_BRIDGE_TYPE=${STREAM_BRIDGE_TYPE:-redis}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
      - REDIS_URL=${REDIS_URL:-redis://numina-redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent:
    image: ${AGENT_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    expose:
      - "8001"
    # Allow containers to reach host services (e.g. PostgreSQL on host:5432)
    # via the special DNS name "host.docker.internal".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      # ── 数据库 ──
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DEERFLOW_DB_URL=${DEERFLOW_DB_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina_deerflow}
      - DB_POOL_SIZE=${AGENT_DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${AGENT_DB_MAX_OVERFLOW:-5}
      # ── 安全密钥 ──
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be set}
      # ── 应用配置 ──
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_BASE_URL=http://numina-backend:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_MODEL=${AI_MODEL:-placeholder}
      - AI_API_KEY=${AI_API_KEY:-placeholder}
      # ── Redis ──
      - REDIS_URL=${REDIS_URL:-redis://numina-redis:6379/0}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler_worker:
    image: ${SCHEDULER_WORKER_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    expose:
      - "8002"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - NUMINA_PROJECT_ROOT=/app
      # ── 数据库 ──
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DB_POOL_SIZE=${SCHEDULER_DB_POOL_SIZE:-2}
      - DB_MAX_OVERFLOW=${SCHEDULER_DB_MAX_OVERFLOW:-1}
      # ── 安全密钥 ──
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be set}
      # ── 应用配置 ──
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
      # ── Redis ──
      - REDIS_URL=${REDIS_URL:-redis://numina-redis:6379/0}
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-main:
    image: ${FRONTEND_MAIN_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/main/Dockerfile
    container_name: numina-frontend-main
    restart: unless-stopped
    expose:
      - "80"

  frontend-child:
    image: ${FRONTEND_CHILD_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/child/Dockerfile
    container_name: numina-frontend-child
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/site:ro
      - ${NUMINA_DATA_DIR:-./.numina/data}/secrets:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-main:
        condition: service_started
      frontend-child:
        condition: service_started

  # ── Redis ────────────────────────────────────────────────────────────────────
  # StreamBridge 跨进程事件分发 + 共享缓存, AI 能力依赖此服务
  #
  # 如需关闭 (纯资产管理, 不使用 AI):
  #   1. 注释掉本 redis 服务定义
  #   2. 注释掉各服务中 REDIS_URL / CACHE_BACKEND / STREAM_BRIDGE_TYPE 环境变量
  #   3. 删除 depends_on redis 条件
  #   4. 移除 volumes 中的 redis_data
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: numina-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (始终包含)
  postgres:
    image: postgres:16-alpine
    container_name: numina-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_DB=${POSTGRES_DB:-numina}
      - POSTGRES_USER=${POSTGRES_USER:-numina}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-numinapass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numina}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Playwright E2E runner (CI 环境使用: --profile test)
  playwright:
    image: ${X_DOCKER_MIRROR:-mcr.microsoft.com}/playwright:v1.52.0-noble
    container_name: numina-playwright
    working_dir: /tests
    volumes:
      - ./tests:/tests
    command: npx playwright test
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    network_mode: host
    profiles:
      - test

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/80

volumes:
  postgres_data:
  redis_data:

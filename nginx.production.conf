upstream backend {
    server backend:8000;
}

upstream frontend-main {
    server frontend-main:80;
}

upstream frontend-child {
    server frontend-child:80;
}

# HTTP server (Cloudflare Flexible SSL / direct HTTP access)
server {
    listen 80;
    server_name numina.xiaoshutiao.space xiaoshutiao.space;

    client_max_body_size 10M;
    server_tokens off;

    # Block internal endpoints
    location ^~ /api/v1/internal {
        return 403;
    }

    # WebSocket
    location /api/v1/ai/report/ws {
        proxy_pass http://backend/api/v1/ai/report/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded files -> FastAPI backend StaticFiles mount
    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/health {
        proxy_pass http://backend/api/health;
        access_log off;
    }

    location /site/overview/ {
        alias /usr/share/nginx/site/overview/;
        try_files $uri $uri/ /site/overview/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/project/ {
        alias /usr/share/nginx/site/project/;
        try_files $uri $uri/ /site/project/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/assets/ {
        alias /usr/share/nginx/site/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /site/style.css {
        alias /usr/share/nginx/site/style.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /child/ {
        proxy_pass http://frontend-child/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend-main/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        alias /usr/share/nginx/site/robots.txt;
        add_header Content-Type text/plain;
        expires 1d;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

# HTTPS server (Cloudflare Full / Full Strict SSL)
server {
    listen 443 ssl;
    server_name numina.xiaoshutiao.space xiaoshutiao.space;

    client_max_body_size 10M;

    # SSL Certificates (Cloudflare Origin CA)
    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Restore real client IP from Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;

    real_ip_header CF-Connecting-IP;

    # Security headers (defense in depth, Cloudflare handles HTTPS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # Block internal service-to-service endpoints from public access
    location ^~ /api/v1/internal {
        return 403;
    }

    # WebSocket endpoints (must be before /api/ to take priority)
    location /api/v1/ai/report/ws {
        proxy_pass http://backend/api/v1/ai/report/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API requests -> FastAPI backend
    # NOTE: Do NOT add CSP here — the backend/inner nginx already sets security headers.
    # Duplicate CSP headers cause browser intersection issues.
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no auth required)
    location /api/health {
        proxy_pass http://backend/api/health;
        access_log off;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Brand/marketing site static pages (site/ mounted at /usr/share/nginx/site)
    # HTML pages use absolute paths: /site/assets/, /site/style.css
    location /site/overview/ {
        alias /usr/share/nginx/site/overview/;
        try_files $uri $uri/ /site/overview/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/project/ {
        alias /usr/share/nginx/site/project/;
        try_files $uri $uri/ /site/project/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /site/assets/ {
        alias /usr/share/nginx/site/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /site/style.css {
        alias /usr/share/nginx/site/style.css;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Child app (separate SPA at /child/)
    location /child/ {
        proxy_pass http://frontend-child/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static files + SPA fallback
    # NOTE: CSP is set by the inner nginx (frontend-main container) with per-request
    # nonce injection. Do NOT add CSP here — duplicate CSP headers cause the browser
    # to enforce the intersection of both policies, breaking blob workers (Altcha CAPTCHA)
    # and nonce-based scripts.
    location / {
        proxy_pass http://frontend-main/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt for crawlers
    location = /robots.txt {
        alias /usr/share/nginx/site/robots.txt;
        add_header Content-Type text/plain;
        expires 1d;
    }

    # Block sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}

# Numina Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.production.yml up -d --build
#
# Prerequisites:
# 1. Clone repository to ~/data/numina
# 2. Copy .env.production.example to .env.production and configure
# 3. Run: docker compose -f docker-compose.production.yml up -d --build

services:
  backend:
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/.numina/data/db/numina.db}
      - NUMINA_PROJECT_ROOT=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    expose:
      - "8000"

  agent:
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - ENVIRONMENT=production
      - BACKEND_BASE_URL=http://numina-backend:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NUMINA_PROJECT_ROOT=/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    expose:
      - "8001"

  scheduler_worker:
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/.numina/data/db/numina.db}
      - ENVIRONMENT=production
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
      - NUMINA_PROJECT_ROOT=/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-main:
    build:
      context: .
      dockerfile: frontend/apps/main/Dockerfile
    container_name: numina-frontend-main
    restart: unless-stopped
    expose:
      - "80"

  frontend-child:
    build:
      context: .
      dockerfile: frontend/apps/child/Dockerfile
    container_name: numina-frontend-child
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NUMINA_DATA_DIR:-./.numina/data}/uploads:/app/.numina/data/uploads:ro
      - ./site:/usr/share/nginx/site:ro
      - ${NUMINA_DATA_DIR:-./.numina/data}/secrets:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-main:
        condition: service_started
      frontend-child:
        condition: service_started

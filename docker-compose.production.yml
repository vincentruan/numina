# Numina Production Docker Compose Configuration
# Usage: docker compose -f docker-compose.production.yml up -d
#
# Pulls pre-built GHCR images (set *_IMAGE in .env) instead of building locally.
# The server NEVER builds — CI builds on push to main, server just pulls.
#
# Prerequisites:
# 1. Clone repository to ~/data/numina
# 2. Configure .env (see .env.production.example for reference)
# 3. Place SSL certs in .numina/data/secrets/ (origin.crt + origin.key)
# 4. Run: docker compose -f docker-compose.production.yml up -d

services:
  backend:
    image: ${BACKEND_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/backend/Dockerfile
    container_name: numina-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DB_POOL_SIZE=8
      - DB_MAX_OVERFLOW=2
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY must be set}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://numina.xiaoshutiao.space","https://xiaoshutiao.space"]}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - AGENT_BASE_URL=http://numina-agent:8001
      - BACKEND_BASE_URL=http://numina-backend:8000
      - NUMINA_PROJECT_ROOT=/app
      - SKIP_INITIAL_EXCHANGE_RATE_FETCH=${SKIP_INITIAL_EXCHANGE_RATE_FETCH:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  agent:
    image: ${AGENT_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/agent/Dockerfile
    container_name: numina-agent
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - ENVIRONMENT=production
      - BACKEND_BASE_URL=http://numina-backend:8000
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY:?ALTCHA_HMAC_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:?STORAGE_ENCRYPTION_KEY must be set}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_MODEL=${AI_MODEL:-placeholder}
      - AI_API_KEY=${AI_API_KEY:-placeholder}
      - NUMINA_PROJECT_ROOT=/app
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DEERFLOW_DB_URL=${DEERFLOW_DB_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina_deerflow}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  scheduler_worker:
    image: ${SCHEDULER_WORKER_IMAGE:-}
    build:
      context: ./server
      dockerfile: apps/scheduler_worker/Dockerfile
    container_name: numina-scheduler-worker
    restart: unless-stopped
    volumes:
      - ${NUMINA_DATA_DIR:-./.numina/data}:/app/.numina/data
      - ./system-config.yaml:/app/system-config.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - DATA_ROOT=/app/.numina/data
      - DATABASE_URL=${DATABASE_URL:-postgresql://numina:numinapass@numina-postgres:5432/numina}
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=1
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - AI_ENCRYPTION_KEY=${AI_ENCRYPTION_KEY:?AI_ENCRYPTION_KEY must be set}
      - ENVIRONMENT=production
      - FILE_SYNC_INTERVAL_MINUTES=${FILE_SYNC_INTERVAL_MINUTES:-30}
      - NUMINA_PROJECT_ROOT=/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend-main:
    image: ${FRONTEND_MAIN_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/main/Dockerfile
    container_name: numina-frontend-main
    restart: unless-stopped
    expose:
      - "80"

  frontend-child:
    image: ${FRONTEND_CHILD_IMAGE:-}
    build:
      context: .
      dockerfile: frontend/apps/child/Dockerfile
    container_name: numina-frontend-child
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: numina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NUMINA_DATA_DIR:-./.numina/data}/uploads:/app/.numina/data/uploads:ro
      - ./site:/usr/share/nginx/site:ro
      - ${NUMINA_DATA_DIR:-./.numina/data}/secrets:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend-main:
        condition: service_started
      frontend-child:
        condition: service_started
